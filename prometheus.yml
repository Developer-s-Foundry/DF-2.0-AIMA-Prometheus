# Prometheus Configuration for Render Deployment
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'render-prometheus'
    environment: 'production'

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          app: 'prometheus'

  # Scrape your Node.js metrics consumer service on Render
  - job_name: 'metrics-consumer'
    scheme: https
    static_configs:
      - targets: ['df-2-0-aima-prometheus-4b5y.onrender.com']
        labels:
          app: 'metrics-consumer-service'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'

  # Scrape the main app (health check endpoint)
  - job_name: 'nodejs-app'
    scheme: https
    static_configs:
      - targets: ['df-2-0-aima-prometheus-4b5y.onrender.com']
        labels:
          app: 'nodejs-app'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/'

# Optional: Add alerting rules
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: []

# Optional: Load additional rule files
# rule_files:
#   - "alerts.yml"
